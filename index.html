<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafa" />
    <meta name="description" content="ITで困りごとを解決。bbbit の Software Engineer、Yuta Yamamoto のデジタル名刺です。" />
    <meta property="og:title" content="bbbit｜PROFILE" />
    <meta property="og:description" content="ITで困りごとを解決。bbbit の Software Engineer、Yuta Yamamoto のデジタル名刺です。" />
    <!--
      QRコードに埋め込むURL（この名刺の公開先）。空にすると、いま開いているページのURLを使います。
    -->
    <meta name="card-url" content="https://hello.bbbit.cc/" />
    <link rel="canonical" href="https://hello.bbbit.cc/" />
    <meta property="og:url" content="https://hello.bbbit.cc/" />
    <meta property="og:type" content="website" />
    <!-- 共有したときのサムネイル。元は og/og-image.html。画像のURLは絶対URLで書く必要がある。 -->
    <meta property="og:image" content="https://hello.bbbit.cc/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="bbbit — 身近な不便を、便利に変えよう。" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <script src="main.js" defer></script>
    <title>bbbit｜PROFILE</title>
  </head>
  <body>
    <main class="stage">
      <!--
        二つ折り名刺（縦）: ひらくと 91 × 110mm、たたむと 91 × 55mm。
        flap = 上にめくれる表紙側の紙、base = 下側の紙。折り目は flap の上辺。
      -->
      <div class="scene" id="scene" data-view="cover">
        <div class="tilt" id="tilt">
          <div class="book" id="book" role="button" tabindex="0" aria-label="名刺をめくる">
            <div class="panel base">
              <!-- 中面（下） -->
              <section class="face inner inner-bottom dark" id="inner-bottom" aria-label="中面 bbbit について" inert>
                <!-- bbbit.cc の About から。 -->
                <h2 class="about-head">
                  What is
                  <svg viewBox="0 0 164 52" fill="none" role="img" aria-label="bbbit">
                    <g fill="currentColor" transform="translate(2 2)">
                      <path fill-rule="evenodd" d="M0 0h9v14h23v34H0V0Zm9 23v16h14V23H9Z" />
                      <path fill-rule="evenodd" d="M39 0h9v14h23v34H39V0Zm9 23v16h14V23H48Z" />
                      <path fill-rule="evenodd" d="M78 0h9v14h23v34H78V0Zm9 23v16h14V23H87Z" />
                      <path d="M117 14h9v34h-9zM140 0h9v14h11v9h-11v16h11v9h-20V23h-8v-9h8V0Z" />
                    </g>
                    <path fill="#16BED0" d="M119 2h9v9h-9z" />
                  </svg><span class="q">?</span>
                </h2>
                <p class="about-lead">
                  bbbit（ビビビット）は、ITやAIを活かして、<br />身近な<mark>「不便」</mark>の解消に取り組んでいます。
                </p>
                <!--
                  図解: IT・AI から「いいね」が
                  あなた → 家族・仲間 → 地域・社会 へ届く流れとして並べる。
                -->
                <div class="rule" aria-hidden="true"><span></span></div>
                <div class="flow" role="img" aria-label="IT・AI を活かして、あなた、家族・仲間、地域・社会へ「いいね」を届ける">
                  <div class="node node-it"><span class="tile"><svg viewBox="0 0 43 48"><path d="M0 14h9v34H0zM23 0h9v14h11v9H32v16h11v9H23V23h-8v-9h8V0Z" /><path class="it-dot" d="M0 0h9v9H0z" /></svg></span><span class="node-label">IT・AI</span></div>
                  <svg class="flow-arrow" viewBox="0 0 32 14" aria-hidden="true"><path d="M1 7h30m-5-5 5 5-5 5" /></svg>
                  <div class="node"><span class="tile"><svg class="tile-thumb" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10v12M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z" /></svg></span><span class="node-label">あなた</span></div>
                  <svg class="flow-arrow" viewBox="0 0 32 14" aria-hidden="true"><path d="M1 7h30m-5-5 5 5-5 5" /></svg>
                  <div class="node"><span class="tile"><svg class="tile-thumb" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10v12M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z" /></svg></span><span class="node-label">家族・仲間</span></div>
                  <svg class="flow-arrow" viewBox="0 0 32 14" aria-hidden="true"><path d="M1 7h30m-5-5 5 5-5 5" /></svg>
                  <div class="node"><span class="tile"><svg class="tile-thumb" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10v12M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z" /></svg></span><span class="node-label">地域・社会</span></div>
                </div>
                <p class="about-note">あなたの「いいね」を、地域の「いいね」へ。</p>
              </section>

              <!-- 裏面 -->
              <section class="face dark back-cover" id="back-cover" aria-label="裏面" inert>
                <span class="corner" aria-hidden="true"></span>
                <div class="grid" aria-hidden="true"></div>
                <div class="qr" id="qr" role="img" aria-label="この名刺のQRコード"></div>
                <div class="back-info">
                  <p class="trade">ITで困りごとを解決</p>
                  <p class="catch">身近な不便を、<br />便利に変えよう。</p>
                  <p class="domain"><a href="mailto:hello@bbbit.cc">hello@bbbit.cc</a></p>
                </div>
                <div class="glare" aria-hidden="true"></div>
              </section>
            </div>

            <div class="panel flap">
              <!-- 案内線の起点。名刺と一緒に動くので、その画面上の位置に線の根元を合わせる。 -->
              <span class="callout-anchor" id="callout-anchor" aria-hidden="true"></span>
              <!-- 表紙 -->
              <section class="face dark cover" id="cover" aria-label="表紙">
                <span class="corner" aria-hidden="true"></span>
                <div class="grid" aria-hidden="true"></div>
                <svg class="logo" viewBox="0 0 164 52" fill="none" role="img" aria-label="bbbit">
                  <g fill="currentColor" transform="translate(2 2)">
                    <path fill-rule="evenodd" d="M0 0h9v14h23v34H0V0Zm9 23v16h14V23H9Z" />
                    <path fill-rule="evenodd" d="M39 0h9v14h23v34H39V0Zm9 23v16h14V23H48Z" />
                    <path fill-rule="evenodd" d="M78 0h9v14h23v34H78V0Zm9 23v16h14V23H87Z" />
                    <path d="M117 14h9v34h-9zM140 0h9v14h11v9h-11v16h11v9h-20V23h-8v-9h8V0Z" />
                  </g>
                  <path fill="#16BED0" d="M119 2h9v9h-9z" />
                </svg>
                <div class="glare" aria-hidden="true"></div>
              </section>

              <!-- 中面（上） -->
              <section class="face inner inner-top" id="inner-top" aria-label="中面 プロフィール" inert>
                <span class="corner" aria-hidden="true"></span>
                <!-- 上段: だれか（アイコン・名前・肩書き） -->
                <div class="id-row">
                  <img class="avatar" src="avatar-84.webp" srcset="avatar-84.webp 1x, avatar.webp 2x" alt="" width="216" height="228" decoding="async" fetchpriority="low" />
                  <div class="inner-id">
                    <h1 class="inner-name">Yuta Yamamoto</h1>
                    <p class="inner-role">Software Engineer</p>
                    <p class="inner-bio">個人でアプリやツールを設計・開発しています。</p>
                  </div>
                </div>
                <!-- 下段: 左（アイコンの下）に拠点、右にSNS。SNSの左端は名前の左端にそろえる。 -->
                <div class="id-foot">
                  <p class="base-in"><span>Wakayama</span></p>
                  <!-- bbbit.cc の About と同じ並び。X と YouTube は未開設なので、薄い表示でリンクなし。 -->
                  <ul class="socials">
                    <li>
                      <a href="https://github.com/tuki0918" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" /></svg>
                      </a>
                    </li>
                    <li>
                      <a href="https://zenn.dev/tuki0918" target="_blank" rel="noopener noreferrer" aria-label="Zenn">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M.264 23.771h4.984c.264 0 .498-.147.645-.352L19.614.874c.176-.293-.029-.645-.381-.645h-4.72c-.235 0-.44.117-.557.323L.03 23.361c-.088.176.029.41.234.41zM17.445 23.419l6.479-10.408c.205-.323-.029-.733-.41-.733h-4.691c-.176 0-.352.088-.44.235l-6.655 10.643c-.176.264.029.616.352.616h4.779c.234-.001.468-.118.586-.353z" /></svg>
                      </a>
                    </li>
                    <li>
                      <a href="https://note.com/tuki0918" target="_blank" rel="noopener noreferrer" aria-label="note">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M0 .279c4.623 0 10.953-.235 15.498-.117 6.099.156 8.39 2.813 8.468 9.374.077 3.71 0 14.335 0 14.335h-6.598c0-9.296.04-10.83 0-13.759-.078-2.578-.814-3.807-2.795-4.041-2.097-.235-7.975-.04-7.975-.04v17.84H0Z" /></svg>
                      </a>
                    </li>
                    <li>
                      <span class="social-off" title="X（準備中）">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="line" d="m4 3 16 18h-5L4 3h5l11 18M20 3 4 21" /></svg>
                      </span>
                    </li>
                    <li>
                      <span class="social-off" title="YouTube（準備中）">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M21.6 5.1C20.9 4.4 18.1 4 12 4s-8.9.4-9.6 1.1C1.4 6.1 1 8.1 1 12s.4 5.9 1.4 6.9C3.1 19.6 5.9 20 12 20s8.9-.4 9.6-1.1C22.6 17.9 23 15.9 23 12s-.4-5.9-1.4-6.9ZM10 8l6 4-6 4V8Z" /></svg>
                      </span>
                    </li>
                    <li>
                      <a href="mailto:hello@bbbit.cc" aria-label="メール">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><g class="line"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="m3 6 9 7 9-7" /></g></svg>
                      </a>
                    </li>
                  </ul>
                </div>
              </section>
            </div>
          </div>
        </div>
        <div class="shadow" aria-hidden="true"></div>
        <!-- 表紙・中面・裏面のどれを見ているかを示す点。操作はできない。 -->
        <div class="pager" aria-hidden="true"><span></span><span></span><span></span></div>

        <!-- 表紙のときだけ、カードから線が伸びて出る案内。PCではホバー中、スマホでは最初のタップまで表示。 -->
        <div class="callout callout-tap" id="callout" aria-hidden="true">
          <span class="callout-dot" id="callout-dot"></span>
          <!-- 斜め線: 点の中心から右上へ1マス分(2.2em)。横線と同じ線種・同じ太さ。 -->
          <svg class="callout-diag"><line id="callout-diag-line" x1="11.1%" y1="92.3%" x2="100%" y2="0" pathLength="1" /></svg>
          <span class="callout-label">
            <span class="callout-text">カードを開く</span>
            <!-- 横線: この要素の幅いっぱいなので、長さは文字の幅と同じになる。 -->
            <svg class="callout-rule"><line x1="-0.5" y1="1" x2="100%" y2="1" pathLength="1" /></svg>
          </span>
        </div>
      </div>

      <nav class="actions" aria-label="操作">
        <!-- 公式サイトへのリンク。「連絡先に追加」と同じ大きさ・同じ色で左に並べる。 -->
        <a class="btn site-link" href="https://bbbit.cc" target="_blank" rel="noopener noreferrer">
          ホームへ
          <!-- 外へ出るリンクなので、矢印は文字の後ろに置く。 -->
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8" /></svg>
        </a>
        <a class="btn primary" href="yuta-yamamoto.vcf" download="yuta-yamamoto.vcf">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 19v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1M9 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM19 8v6M16 11h6" /></svg>
          連絡先に追加
        </a>
      </nav>
    </main>

  </body>
</html>
