<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101214" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Yuta Yamamoto — Software Engineer / Indie Developer (bbbit) のデジタル名刺" />
    <meta property="og:title" content="Yuta Yamamoto — bbbit" />
    <meta property="og:description" content="Software Engineer / Indie Developer のデジタル名刺" />
    <!--
      QRコードに埋め込むURL。空のままなら、いま開いているページのURLを使います。
      公開先が決まったら content に入れてください（例: https://meishi.example.com/）。
    -->
    <meta name="card-url" content="" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..700&amp;family=Space+Grotesk:wght@400..700&amp;display=swap"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Yuta Yamamoto — bbbit</title>
  </head>
  <body>
    <main class="stage">
      <!--
        二つ折り名刺（縦）: ひらくと 91 × 110mm、たたむと 91 × 55mm。
        flap = 上にめくれる表紙側の紙、base = 下側の紙。折り目は flap の上辺。
      -->
      <div class="scene" id="scene" data-view="cover">
        <div class="tilt" id="tilt">
          <div class="book" id="book" role="button" tabindex="0" aria-label="名刺をめくる">
            <div class="panel base">
              <!-- 中面（下） -->
              <section class="face inner inner-bottom dark" id="inner-bottom" aria-label="中面 bbbit について" inert>
                <div class="grid" aria-hidden="true"></div>
                <!-- bbbit.cc の About から。 -->
                <h2 class="about-head">What is bbbit<span>?</span></h2>
                <p class="about-lead">
                  bbbit（ビビビット）は、ITやAIを活かして、<br />身近な<mark>「不便」</mark>の解消に取り組んでいます。
                </p>
                <!--
                  図解: ロゴを it / b / b / b に分け、IT・AI から「いいね」が
                  あなた → 家族・仲間 → 地域 へ届く流れとして並べる。
                -->
                <div class="rule" aria-hidden="true"><span></span></div>
                <div class="flow" role="img" aria-label="IT・AI を活かして、あなた、家族・仲間、地域へ「いいね」を届ける">
                  <div class="node node-it"><span class="tile"><svg viewBox="0 0 43 48"><path d="M0 14h9v34H0zM23 0h9v14h11v9H32v16h11v9H23V23h-8v-9h8V0Z" /><path class="it-dot" d="M0 0h9v9H0z" /></svg></span><span class="node-label">IT・AI</span></div>
                  <div class="node"><span class="tile"><svg viewBox="0 0 32 48"><path fill-rule="evenodd" d="M0 0h9v14h23v34H0V0Zm9 23v16h14V23H9Z" /></svg></span><span class="node-label">あなた</span></div>
                  <div class="node"><span class="tile"><svg viewBox="0 0 32 48"><path fill-rule="evenodd" d="M0 0h9v14h23v34H0V0Zm9 23v16h14V23H9Z" /></svg></span><span class="node-label">家族・仲間</span></div>
                  <div class="node"><span class="tile"><svg viewBox="0 0 32 48"><path fill-rule="evenodd" d="M0 0h9v14h23v34H0V0Zm9 23v16h14V23H9Z" /></svg></span><span class="node-label">地域</span></div>
                </div>
              </section>

              <!-- 裏面 -->
              <section class="face dark back-cover" id="back-cover" aria-label="裏面" inert>
                <span class="corner" aria-hidden="true"></span>
                <div class="grid" aria-hidden="true"></div>
                <div class="qr" id="qr" role="img" aria-label="この名刺のQRコード"></div>
                <div class="back-info">
                  <p class="trade">ITで困りごとを解決</p>
                  <p class="catch">身近な不便を、<br />便利に変えよう。</p>
                  <p class="domain"><a href="mailto:hello@bbbit.cc">hello@bbbit.cc</a></p>
                </div>
                <div class="glare" aria-hidden="true"></div>
              </section>
            </div>

            <div class="panel flap">
              <!-- 案内線の起点。名刺と一緒に動くので、その画面上の位置に線の根元を合わせる。 -->
              <span class="callout-anchor" id="callout-anchor" aria-hidden="true"></span>
              <!-- 表紙 -->
              <section class="face dark cover" id="cover" aria-label="表紙">
                <span class="corner" aria-hidden="true"></span>
                <div class="grid" aria-hidden="true"></div>
                <svg class="logo" viewBox="0 0 164 52" fill="none" role="img" aria-label="bbbit">
                  <g fill="currentColor" transform="translate(2 2)">
                    <path fill-rule="evenodd" d="M0 0h9v14h23v34H0V0Zm9 23v16h14V23H9Z" />
                    <path fill-rule="evenodd" d="M39 0h9v14h23v34H39V0Zm9 23v16h14V23H48Z" />
                    <path fill-rule="evenodd" d="M78 0h9v14h23v34H78V0Zm9 23v16h14V23H87Z" />
                    <path d="M117 14h9v34h-9zM140 0h9v14h11v9h-11v16h11v9h-20V23h-8v-9h8V0Z" />
                  </g>
                  <path fill="#16BED0" d="M119 2h9v9h-9z" />
                </svg>
                <div class="glare" aria-hidden="true"></div>
              </section>

              <!-- 中面（上） -->
              <section class="face inner inner-top" id="inner-top" aria-label="中面 プロフィール" inert>
                <span class="corner" aria-hidden="true"></span>
                <img class="avatar" src="avatar.webp" alt="" width="216" height="228" />
                <div class="inner-id">
                  <h1 class="inner-name">Yuta Yamamoto</h1>
                  <p class="inner-role">Software Engineer<br />Indie Developer</p>
                  <!-- GitHub・X・YouTube・Mail。X と YouTube は未開設なので、bbbit.cc と同じく薄い表示でリンクなし。 -->
                  <ul class="socials">
                    <li>
                      <a href="https://github.com/tuki0918" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" /></svg>
                      </a>
                    </li>
                    <li>
                      <span class="social-off" title="X（準備中）">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="line" d="m4 3 16 18h-5L4 3h5l11 18M20 3 4 21" /></svg>
                      </span>
                    </li>
                    <li>
                      <span class="social-off" title="YouTube（準備中）">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M21.6 5.1C20.9 4.4 18.1 4 12 4s-8.9.4-9.6 1.1C1.4 6.1 1 8.1 1 12s.4 5.9 1.4 6.9C3.1 19.6 5.9 20 12 20s8.9-.4 9.6-1.1C22.6 17.9 23 15.9 23 12s-.4-5.9-1.4-6.9ZM10 8l6 4-6 4V8Z" /></svg>
                      </span>
                    </li>
                    <li>
                      <a href="mailto:hello@bbbit.cc" aria-label="メール">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><g class="line"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="m3 6 9 7 9-7" /></g></svg>
                      </a>
                    </li>
                  </ul>
                </div>
              </section>
            </div>
          </div>
        </div>
        <div class="shadow" aria-hidden="true"></div>

        <!-- 表紙のときだけ、カードから線が伸びて出る案内。PCではホバー中、スマホでは最初のタップまで表示。 -->
        <div class="callout" id="callout" aria-hidden="true">
          <span class="callout-dot" id="callout-dot"></span>
          <!-- 斜め線: 点の中心から右上へ1マス分(2.2em)。横線と同じ線種・同じ太さ。 -->
          <svg class="callout-diag"><line id="callout-diag-line" x1="11.1%" y1="92.3%" x2="100%" y2="0" pathLength="1" /></svg>
          <span class="callout-label">
            <span class="callout-text">タップでひらく</span>
            <!-- 横線: この要素の幅いっぱいなので、長さは文字の幅と同じになる。 -->
            <svg class="callout-rule"><line x1="-0.5" y1="1" x2="100%" y2="1" pathLength="1" /></svg>
          </span>
        </div>
      </div>

      <nav class="actions" aria-label="操作">
        <a class="btn primary" href="yuta-yamamoto.vcf" download="yuta-yamamoto.vcf">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 19v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1M9 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM19 8v6M16 11h6" /></svg>
          連絡先に追加
        </a>
      </nav>
    </main>

    <script src="vendor/qrcode.js"></script>
    <script src="main.js"></script>
  </body>
</html>
