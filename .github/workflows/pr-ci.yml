name: Pull request CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
    # Roster-only requests are rebuilt on the branch generated by the registration Bot.
    paths-ignore: [CONTRIBUTORS.txt]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Site build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install locked build dependencies
        run: npm ci --ignore-scripts
      - name: Check contributor automation syntax
        run: node --check scripts/register-contributor.mjs
      - name: Build the site
        run: npm run build
